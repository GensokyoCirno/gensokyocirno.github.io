<header class="header">
  <div class="header-left">
    <!-- 侧边栏切换按钮 -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="切换侧边栏">
      <span class="toggle-inner">
        <span class="hamburger-icon">☰</span>
      </span>
    </button>
    <h1>
      🏛️ 罗马维基
      <small>· 固定布局</small>
    </h1>
  </div>

  <div class="header-center" title="Θά 'ρθεις σαν αστραπή — 你将如闪电般归来">
    <!-- 桌面端：完整标语 -->
    <span class="slogan-full">⚡ Θά 'ρθεις σαν αστραπή — 你将如闪电般归来</span>
    <!-- 移动端：精简标语 -->
    <span class="slogan-short">你将如闪电般归来</span>
  </div>

  <div class="header-right">
    <!-- 复制网址按钮 -->
    <button class="btn-wiki btn-copy" id="copyUrlBtn" role="button" aria-label="复制当前页面网址">
      <i>🔗</i> <span class="copy-text">复制网址</span>
    </button>
    
    <!-- 回到首页按钮 -->
    <button class="btn-wiki btn-home" id="homeBtn" role="button" aria-label="回到首页" onclick="window.location.href='{{ '/' | relative_url }}'">
      <i>🏠</i> <span class="home-text">回到首页</span>
    </button>
  </div>
</header>
